<script>
/* ===== PWA: Install / Add to Home screen (needs https:// host, not file://) ===== */
(function(){
  function iconDataUrl(size){
    var c = document.createElement('canvas');
    c.width = size; c.height = size;
    var g = c.getContext('2d');
    var grd = g.createLinearGradient(0, 0, size, size);
    grd.addColorStop(0, '#0f766e');
    grd.addColorStop(1, '#0891b2');
    g.fillStyle = grd;
    g.fillRect(0, 0, size, size);
    // rounded doc
    var m = size * 0.18, w = size - m * 2, h = size * 0.62, x = m, y = size * 0.19, r = size * 0.06;
    g.fillStyle = '#fff';
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r);
    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
    g.fill();
    // M mark
    g.strokeStyle = '#0f766e';
    g.lineWidth = Math.max(3, size * 0.045);
    g.lineCap = 'round';
    g.lineJoin = 'round';
    var mx = size * 0.32, my1 = size * 0.58, my0 = size * 0.38, mid = size * 0.5;
    g.beginPath();
    g.moveTo(mx, my1);
    g.lineTo(mx, my0);
    g.lineTo(mid, size * 0.52);
    g.lineTo(size - mx, my0);
    g.lineTo(size - mx, my1);
    g.stroke();
    return c.toDataURL('image/png');
  }
  function installManifest(){
    try{
      var icons = [
        { src: iconDataUrl(192), sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: iconDataUrl(512), sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: iconDataUrl(512), sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ];
      var manifest = {
        id: './',
        name: 'Invoice Management System',
        short_name: 'Invoice',
        description: 'Sales Invoice, Gate Pass & Requisition',
        start_url: './',
        scope: './',
        display: 'standalone',
        orientation: 'portrait-primary',
        background_color: '#0f766e',
        theme_color: '#0f766e',
        icons: icons,
        lang: 'bn',
        dir: 'ltr'
      };
      var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      var url = URL.createObjectURL(blob);
      var link = document.getElementById('appManifestLink');
      if(link) link.setAttribute('href', url);
    }catch(e){}
  }
  function registerSW(){
    if(!('serviceWorker' in navigator)) return;
    // Only on http/https (not file://)
    if(location.protocol !== 'http:' && location.protocol !== 'https:') return;
    var swBody = [
      "self.addEventListener('install',function(e){self.skipWaiting();});",
      "self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim());});",
      "self.addEventListener('fetch',function(e){",
      "  e.respondWith(fetch(e.request).catch(function(){return caches.match(e.request);}));",
      "});"
    ].join('');
    try{
      var swUrl = URL.createObjectURL(new Blob([swBody], { type: 'text/javascript' }));
      navigator.serviceWorker.register(swUrl).catch(function(){});
    }catch(e){}
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){ installManifest(); registerSW(); });
  } else {
    installManifest();
    registerSW();
  }
})();
</script>
<style>
  :root{

(function(){

  function group(d){

    return d.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, &#x27;,&#x27;) + &#x27;,&#x27; + d.slice(-3);

&lt;script&gt;
  // ================= CORE CALCULATION LOGIC (original) =================
  function formatBD(num, decimals = 2) {
    return num.toLocaleString(&#x27;en-IN&#x27;, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }

  function numberToWords(num) {
    if (num === 0) return &#x27;Zero&#x27;;
    const a = [&#x27;&#x27;, &#x27;One&#x27;, &#x27;Two&#x27;, &#x27;Three&#x27;, &#x27;Four&#x27;, &#x27;Five&#x27;, &#x27;Six&#x27;, &#x27;Seven&#x27;, &#x27;Eight&#x27;, &#x27;Nine&#x27;, &#x27;Ten&#x27;,
               &#x27;Eleven&#x27;, &#x27;Twelve&#x27;, &#x27;Thirteen&#x27;, &#x27;Fourteen&#x27;, &#x27;Fifteen&#x27;, &#x27;Sixteen&#x27;, &#x27;Seventeen&#x27;, &#x27;Eighteen&#x27;, &#x27;Nineteen&#x27;];
    const b = [&#x27;&#x27;, &#x27;&#x27;, &#x27;Twenty&#x27;, &#x27;Thirty&#x27;, &#x27;Forty&#x27;, &#x27;Fifty&#x27;, &#x27;Sixty&#x27;, &#x27;Seventy&#x27;, &#x27;Eighty&#x27;, &#x27;Ninety&#x27;];

    function inWords(n) {
      if (n &lt; 20) return a[n];
      if (n &lt; 100) return b[Math.floor(n / 10)] + (n % 10 !== 0 ? &#x27; &#x27; + a[n % 10] : &#x27;&#x27;);
      if (n &lt; 1000) return a[Math.floor(n / 100)] + &#x27; Hundred&#x27; + (n % 100 !== 0 ? &#x27; &#x27; + inWords(n % 100) : &#x27;&#x27;);
      if (n &lt; 100000) return inWords(Math.floor(n / 1000)) + &#x27; Thousand&#x27; + (n % 1000 !== 0 ? &#x27; &#x27; + inWords(n % 1000) : &#x27;&#x27;);
      if (n &lt; 10000000) return inWords(Math.floor(n / 100000)) + &#x27; Lakh&#x27; + (n % 100000 !== 0 ? &#x27; &#x27; + inWords(n % 100000) : &#x27;&#x27;);
      return inWords(Math.floor(n / 10000000)) + &#x27; Crore&#x27; + (n % 10000000 !== 0 ? &#x27; &#x27; + inWords(n % 10000000) : &#x27;&#x27;);
    }
    return inWords(num);
  }

  function updateSL() {
    const rows = document.querySelectorAll(&#x27;#tbody-items tr&#x27;);
    rows.forEach((row, index) =&gt; {
      const slTd = row.querySelector(&#x27;.sl-no&#x27;);
      if (slTd) slTd.textContent = index + 1;
    });
    calcCalculations();
  }

  function addRow() {
    const tbody = document.getElementById(&#x27;tbody-items&#x27;);
    const tr = document.createElement(&#x27;tr&#x27;);
    tr.innerHTML = `
      &lt;td class=&quot;sl-no&quot;&gt;&lt;/td&gt;
      &lt;td class=&quot;item-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;inp-item&quot;&gt;&lt;/td&gt;
      &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;pcs-input&quot; oninput=&quot;calcCalculations()&quot;&gt;&lt;/td&gt;
      &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;kg-input&quot; oninput=&quot;calcCalculations()&quot;&gt;&lt;/td&gt;
      &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;yds-input&quot; oninput=&quot;calcCalculations()&quot;&gt;&lt;/td&gt;
      &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;rate-input&quot; oninput=&quot;calcCalculations()&quot;&gt;&lt;/td&gt;
      &lt;td class=&quot;row-total&quot;&gt;0.00৳&lt;/td&gt;
      &lt;td class=&quot;action-btn-cell&quot;&gt;&lt;button class=&quot;btn-del&quot; onclick=&quot;deleteRow(this)&quot;&gt;×&lt;/button&gt;&lt;/td&gt;
    `;
    tbody.appendChild(tr);
    updateSL();
  }

  function deleteRow(btn) {
    const tbody = document.getElementById(&#x27;tbody-items&#x27;);
    if (tbody.querySelectorAll(&#x27;tr&#x27;).length &lt;= 1) {
      toast(&quot;কমপক্ষে একটি রো (Row) থাকতে হবে!&quot;, &#x27;error&#x27;);
      return;
    }
    btn.closest(&#x27;tr&#x27;).remove();
    updateSL();
  }

  function calcCalculations() {
    let totalPcs = 0, totalKg = 0, totalYds = 0, grandTotal = 0;
    const rows = document.querySelectorAll(&#x27;#tbody-items tr&#x27;);
    rows.forEach(row =&gt; {
      const pcs = parseFloat(row.querySelector(&#x27;.pcs-input&#x27;).value) || 0;
      const kg = parseFloat(row.querySelector(&#x27;.kg-input&#x27;).value) || 0;
      const yds = parseFloat(row.querySelector(&#x27;.yds-input&#x27;).value) || 0;
      const rate = parseFloat(row.querySelector(&#x27;.rate-input&#x27;).value) || 0;

      totalPcs += pcs; totalKg += kg; totalYds += yds;

      let qty = yds &gt; 0 ? yds : (kg &gt; 0 ? kg : pcs);
      let rowTotal = qty * rate;

      row.querySelector(&#x27;.row-total&#x27;).textContent = formatBD(rowTotal) + &#x27;৳&#x27;;
      grandTotal += rowTotal;
    });

    document.getElementById(&#x27;totalPcs&#x27;).textContent = formatBD(totalPcs, 0);
    document.getElementById(&#x27;totalKg&#x27;).textContent = formatBD(totalKg, 0);
    document.getElementById(&#x27;totalYds&#x27;).textContent = formatBD(totalYds, 0);
    document.getElementById(&#x27;grandTotal&#x27;).textContent = formatBD(grandTotal) + &#x27;৳&#x27;;

    const usdVal = grandTotal / (window.__usdRate || 120);
    document.getElementById(&#x27;usdTotal&#x27;).textContent = &#x27;$&#x27; + formatBD(usdVal);

    const advance = parseFloat(document.getElementById(&#x27;advReduction&#x27;).value) || 0;
    const paid = grandTotal - advance;
    const finalPaid = paid &gt; 0 ? paid : 0;
    document.getElementById(&#x27;paidAmount&#x27;).textContent = formatBD(finalPaid) + &#x27;৳&#x27;;

    const integerPart = Math.floor(finalPaid);
    document.getElementById(&#x27;inWordText&#x27;).textContent = integerPart &gt; 0 ? numberToWords(integerPart) + &#x27; BDT Only.&#x27; : &#x27;Zero BDT Only.&#x27;;
  }

  function clearAllData() {

&lt;script&gt;
/* ===== Motion helpers ===== */
(function(){
  if(window.matchMedia &amp;&amp; matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches) return;
  var ready = false;
  var TOTAL_SEL = &#x27;.row-total, .total-row td, tfoot td[id], [id*=&quot;otal&quot;]&#x27;;
  var last = new WeakMap();

  function snapshot(root){
    if(!root.querySelectorAll) return;
    var list = root.matches &amp;&amp; root.matches(TOTAL_SEL) ? [root] : [];
    list = list.concat([].slice.call(root.querySelectorAll(TOTAL_SEL)));
    list.forEach(function(el){ last.set(el, el.textContent); });
  }
  snapshot(document.body);

  function animateRow(tr){
    snapshot(tr);
    tr.classList.add(&#x27;row-in&#x27;);
    setTimeout(function(){ tr.classList.remove(&#x27;row-in&#x27;); }, 600);
  }
  function flash(el){
    el.classList.remove(&#x27;num-flash&#x27;); void el.offsetWidth;
    el.classList.add(&#x27;num-flash&#x27;);
    setTimeout(function(){ el.classList.remove(&#x27;num-flash&#x27;); }, 700);
  }

  new MutationObserver(function(list){
    list.forEach(function(m){
      if(m.type === &#x27;childList&#x27; &amp;&amp; m.target.tagName === &#x27;TBODY&#x27;){
        [].forEach.call(m.addedNodes, function(n){
          if(n.nodeType === 1 &amp;&amp; n.tagName === &#x27;TR&#x27;){ if(ready) animateRow(n); else snapshot(n); }
        });
        return;
      }
      var el = m.target.nodeType === 3 ? m.target.parentNode : m.target;
      if(!el || !el.matches || !el.matches(TOTAL_SEL)) return;
      var prev = last.get(el), now = el.textContent;
      last.set(el, now);
      if(ready &amp;&amp; prev !== undefined &amp;&amp; prev !== now) flash(el);
    });
  }).observe(document.body, {childList:true, subtree:true, characterData:true});

  window.addEventListener(&#x27;load&#x27;, function(){ setTimeout(function(){ ready = true; }, 150); });

  var od = window.deleteRow;
  if(typeof od === &#x27;function&#x27;){
    window.deleteRow = function(btn){
      var tr = btn &amp;&amp; btn.closest &amp;&amp; btn.closest(&#x27;tr&#x27;);
      if(!tr || tr.classList.contains(&#x27;row-out&#x27;) || tr.parentNode.querySelectorAll(&#x27;tr&#x27;).length &lt;= 1){
        return od.apply(this, arguments);
      }
      var self = this, args = arguments;
      tr.classList.add(&#x27;row-out&#x27;);
      setTimeout(function(){ od.apply(self, args); }, 200);
    };
  }

  var ot = window.toggleTheme;
  if(typeof ot === &#x27;function&#x27;){
    window.toggleTheme = function(){
      var h = document.documentElement;
      h.classList.add(&#x27;theme-fade&#x27;);
      setTimeout(function(){ h.classList.remove(&#x27;theme-fade&#x27;); }, 450);
      return ot.apply(this, arguments);
    };
  }
})();
&lt;/script&gt;
&lt;script&gt;
/* ===== Bangladeshi number grouping (12,34,567.50) ===== */
(function(){
  var _pf = window.parseFloat;
  window.parseFloat = function(v){ return _pf(typeof v === &#x27;string&#x27; ? v.replace(/,/g, &#x27;&#x27;) : v); };

  var SEL = &#x27;.pcs-input,.kg-input,.inp-kg,.yds-input,.inp-yds,.rate-input,#advReduction&#x27;;
  function group(d){
    if(d.length &lt;= 3) return d;
    return d.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, &#x27;,&#x27;) + &#x27;,&#x27; + d.slice(-3);
  }
  function fmt(str){
    var raw = String(str).replace(/[^0-9.]/g, &#x27;&#x27;);
    var i = raw.indexOf(&#x27;.&#x27;), hasDot = i &gt;= 0;
    var ip = hasDot ? raw.slice(0, i) : raw;
    var fp = hasDot ? raw.slice(i + 1).replace(/\./g, &#x27;&#x27;) : &#x27;&#x27;;
    ip = ip.replace(/^0+(?=\d)/, &#x27;&#x27;);
    return group(ip) + (hasDot ? &#x27;.&#x27; + fp : &#x27;&#x27;);
  }
  function fmtInput(el){
    var v = el.value;
    var pos = (el.selectionStart == null) ? v.length : el.selectionStart;
    var digitsBefore = v.slice(0, pos).replace(/[^0-9.]/g, &#x27;&#x27;).length;

  /* ---------- inputs: compact (3+ rows visible without scroll) ---------- */

    width:100% !important; height:42px; padding:0 12px !important; box-sizing:border-box; font-size:16px !important; font-weight:600 !important; line-height:1.2;
    color:var(--text, #111) !important; background:transparent !important; border:1.4px solid rgba(100,116,139,.55) !important; border-radius:10px !important; outline:none; box-shadow:none !important; text-align:left !important; }

  .meta-table input:focus, table.data-table input:focus, table.data-table textarea:focus{ border-color:var(--accent1) !important; box-shadow:0 0 0 2px rgba(15,118,110,.16) !important; }
  ::placeholder{ color:rgba(100,116,139,.7); }

  /* ---------- item rows become cards ---------- */

  table.data-table td.row-total{ grid-column:span 3; font-weight:900; font-size:14px; line-height:32px; color:var(--text); }
  table.data-table td.row-total::before{ content:&quot;এই সারির মোট&quot;; line-height:1.15; font-size:10px; }

  .btn-del{ width:30px; height:30px; border-radius:50% !important; font-size:16px !important; line-height:1; display:inline-flex; align-items:center; justify-content:center; padding:0 !important; }

  /* ---------- add-row button lives right under the last row ---------- */
  tbody.add-tbody{ display:block !important; margin-top:-2px; }

  .add-inline{ width:100%; height:52px; border:2px dashed var(--accent1); background:transparent; color:var(--accent1); border-radius:14px; font-size:15px; font-weight:800; cursor:pointer; }

  /* ---------- totals card ---------- */
  table.data-table tfoot{ display:grid !important; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px 10px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px; margin-top:12px; }
  table.data-table tfoot tr{ display:contents !important; }
  table.data-table tfoot td{ display:block !important; padding:0 !important; border:0 !important; background:transparent !important; width:auto !important; text-align:left !important; font-weight:900; font-size:17px; min-width:0; overflow-wrap:anywhere; }
  table.data-table tfoot td:empty, table.data-table tfoot td.action-btn-cell{ display:none !important; }

  #totalPcs::before, .totalPcs::before{ content:&quot;মোট PCS&quot;; }
  #totalKg::before, .totalKg::before{ content:&quot;মোট KG&quot;; }
  #totalYds::before, .totalYds::before{ content:&quot;মোট YDS&quot;; }
  .summary-section{ margin:12px 0 0 !important; }
  .in-word-box{ background:var(--card) !important; border:1px dashed rgba(100,116,139,.6) !important; border-radius:12px !important; padding:11px 13px !important; font-size:13.5px !important; color:var(--text) !important; margin:0 !important; }

  /* Fixed bottom action dock — 4 equal buttons, no horizontal overflow */
  .toolbar-modern{
    order:99 !important;
    position:fixed !important;
    left:0 !important; right:0 !important; bottom:0 !important;
    width:100% !important; max-width:100% !important;
    margin:0 !important; padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px)) !important;
    z-index:100 !important;
    display:flex !important; flex-wrap:nowrap !important; gap:6px !important;
    background:var(--card) !important;
    border:0 !important; border-top:1px solid var(--border) !important; border-radius:0 !important;
    box-shadow:0 -6px 18px rgba(0,0,0,.12) !important;
    box-sizing:border-box !important;
  }
  .toolbar-modern .mbtn{
    flex:1 1 0 !important; min-width:0 !important; max-width:none !important;
    height:42px !important; margin:0 !important; padding:0 6px !important;
    font-size:12px !important; justify-content:center !important;
    white-space:nowrap !important; overflow:hidden !important; text-overflow:ellipsis !important;
  }
  .toolbar-modern .mbtn.push{ margin-left:0 !important; }
  html, body{ padding-bottom:0 !important; }
  .screen-wrapper{ padding-bottom:100px !important; }

&lt;script&gt;
  // ================= CORE LOGIC (original) =================
  function formatBDNumber(val) {
    if (!val &amp;&amp; val !== 0) return &#x27;&#x27;;
    const cleanStr = val.toString().replace(/,/g, &#x27;&#x27;);
    const num = parseFloat(cleanStr);
    if (isNaN(num)) return &#x27;&#x27;;
    return num.toLocaleString(&#x27;en-IN&#x27;);
  }
  function parseFormattedVal(val) {
    if (!val) return 0;
    const cleanStr = val.toString().replace(/,/g, &#x27;&#x27;);
    return parseFloat(cleanStr) || 0;
  }
  function formatNumberInput(input) {
    const rawVal = input.value.replace(/,/g, &#x27;&#x27;).replace(/[^0-9.]/g, &#x27;&#x27;);
    if (rawVal === &#x27;&#x27;) { input.value = &#x27;&#x27;; return; }
    const parts = rawVal.split(&#x27;.&#x27;);
    parts[0] = parts[0].replace(/\B(?=(\d{2})+(?!\d)(?=\d{3}))/g, &quot;,&quot;);
    input.value = parts.join(&#x27;.&#x27;);
  }
  function formatAndCalc(input) { formatNumberInput(input); calcTotal(input); }

  function updateSLAndRemark(block) {
    const tbody = block.querySelector(&#x27;.tbody-items&#x27;);
    const rows = tbody.querySelectorAll(&#x27;tr&#x27;);
    let remarkCell = block.querySelector(&#x27;.remark-cell&#x27;);

    rows.forEach((row, index) =&gt; {
      const slTd = row.querySelector(&#x27;.sl-no&#x27;);
      if (slTd) slTd.textContent = index + 1;
      if (index === 0 &amp;&amp; remarkCell) {
        const actionTd = row.querySelector(&#x27;.action-btn-cell&#x27;);
        row.insertBefore(remarkCell, actionTd);
      }
    });
    if (remarkCell) remarkCell.rowSpan = rows.length &gt; 0 ? rows.length : 1;
    calcBlockTotal(block);
  }

  function addRowToBlock(block) {
    const tbody = block.querySelector(&#x27;.tbody-items&#x27;);
    const tr = document.createElement(&#x27;tr&#x27;);
    tr.innerHTML = `
      &lt;td class=&quot;sl-no&quot;&gt;&lt;/td&gt;
      &lt;td class=&quot;item-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;inp-item&quot;&gt;&lt;/td&gt;
      &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;pcs-input&quot; value=&quot;&quot; oninput=&quot;formatAndCalc(this)&quot;&gt;&lt;/td&gt;
      &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;inp-kg&quot; oninput=&quot;formatAndCalc(this)&quot;&gt;&lt;/td&gt;
      &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;inp-yds&quot; oninput=&quot;formatAndCalc(this)&quot;&gt;&lt;/td&gt;
      &lt;td class=&quot;action-btn-cell&quot;&gt;&lt;button class=&quot;btn-del&quot; onclick=&quot;deleteRow(this)&quot;&gt;×&lt;/button&gt;&lt;/td&gt;
    `;
    tbody.appendChild(tr);
    updateSLAndRemark(block);
  }

  function addRowAll() {
    addRowToBlock(document.getElementById(&#x27;pass1&#x27;));
    addRowToBlock(document.getElementById(&#x27;pass2&#x27;));
  }

  function deleteRow(btn) {
    const block = btn.closest(&#x27;.gate-pass-block&#x27;);
    const tbody = block.querySelector(&#x27;.tbody-items&#x27;);
    if (tbody.querySelectorAll(&#x27;tr&#x27;).length &lt;= 1) {
      toast(&quot;কমপক্ষে একটি রো (Row) থাকতে হবে!&quot;, &#x27;error&#x27;);
      return;
    }
    btn.closest(&#x27;tr&#x27;).remove();
    updateSLAndRemark(block);
  }

  function calcTotal(inputEl) { calcBlockTotal(inputEl.closest(&#x27;.gate-pass-block&#x27;)); }

  function calcBlockTotal(block) {
    let totalPcs = 0, totalKg = 0, totalYds = 0;
    block.querySelectorAll(&#x27;.pcs-input&#x27;).forEach(i =&gt; totalPcs += parseFormattedVal(i.value));
    block.querySelector(&#x27;.totalPcs&#x27;).textContent = formatBDNumber(totalPcs);
    block.querySelectorAll(&#x27;.inp-kg&#x27;).forEach(i =&gt; totalKg += parseFormattedVal(i.value));
    block.querySelector(&#x27;.totalKg&#x27;).textContent = formatBDNumber(totalKg);
    block.querySelectorAll(&#x27;.inp-yds&#x27;).forEach(i =&gt; totalYds += parseFormattedVal(i.value));
    block.querySelector(&#x27;.totalYds&#x27;).textContent = formatBDNumber(totalYds);
  }

  function syncTopToBottom() {
    const p1 = document.getElementById(&#x27;pass1&#x27;);
    const p2 = document.getElementById(&#x27;pass2&#x27;);

    p2.querySelector(&#x27;.inp-transport&#x27;).value = p1.querySelector(&#x27;.inp-transport&#x27;).value;
    p2.querySelector(&#x27;.inp-gno&#x27;).value = p1.querySelector(&#x27;.inp-gno&#x27;).value;
    p2.querySelector(&#x27;.inp-supplier&#x27;).value = p1.querySelector(&#x27;.inp-supplier&#x27;).value;
    p2.querySelector(&#x27;.inp-date&#x27;).value = p1.querySelector(&#x27;.inp-date&#x27;).value;
    p2.querySelector(&#x27;.inp-address&#x27;).value = p1.querySelector(&#x27;.inp-address&#x27;).value;

    const remarkVal = p1.querySelector(&#x27;.inp-remark&#x27;) ? p1.querySelector(&#x27;.inp-remark&#x27;).value : &#x27;&#x27;;
    const tbody1 = p1.querySelector(&#x27;.tbody-items&#x27;);
    const tbody2 = p2.querySelector(&#x27;.tbody-items&#x27;);
    tbody2.innerHTML = &#x27;&#x27;;

    const rows1 = tbody1.querySelectorAll(&#x27;tr&#x27;);
    rows1.forEach((r1, idx) =&gt; {
      const tr = document.createElement(&#x27;tr&#x27;);
      const itemVal = r1.querySelector(&#x27;.inp-item&#x27;) ? r1.querySelector(&#x27;.inp-item&#x27;).value : &#x27;&#x27;;
      const pcsVal = r1.querySelector(&#x27;.pcs-input&#x27;) ? r1.querySelector(&#x27;.pcs-input&#x27;).value : &#x27;&#x27;;
      const kgVal = r1.querySelector(&#x27;.inp-kg&#x27;) ? r1.querySelector(&#x27;.inp-kg&#x27;).value : &#x27;&#x27;;
      const ydsVal = r1.querySelector(&#x27;.inp-yds&#x27;) ? r1.querySelector(&#x27;.inp-yds&#x27;).value : &#x27;&#x27;;

      tr.innerHTML = `
        &lt;td class=&quot;sl-no&quot;&gt;${idx + 1}&lt;/td&gt;
        &lt;td class=&quot;item-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;inp-item&quot; value=&quot;${itemVal}&quot;&gt;&lt;/td&gt;
        &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;pcs-input&quot; value=&quot;${pcsVal}&quot; oninput=&quot;formatAndCalc(this)&quot;&gt;&lt;/td&gt;
        &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;inp-kg&quot; value=&quot;${kgVal}&quot; oninput=&quot;formatAndCalc(this)&quot;&gt;&lt;/td&gt;
        &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;inp-yds&quot; value=&quot;${ydsVal}&quot; oninput=&quot;formatAndCalc(this)&quot;&gt;&lt;/td&gt;
        ${idx === 0 ? &#x27;&lt;td class=&quot;remark-cell&quot; rowspan=&quot;&#x27; + rows1.length + &#x27;&quot; style=&quot;vertical-align: middle;&quot;&gt;&lt;textarea class=&quot;inp-remark&quot;&gt;&#x27; + remarkVal + &#x27;&lt;/textarea&gt;&lt;/td&gt;&#x27; : &#x27;&#x27;}
        &lt;td class=&quot;action-btn-cell&quot;&gt;&lt;button class=&quot;btn-del&quot; onclick=&quot;deleteRow(this)&quot;&gt;×&lt;/button&gt;&lt;/td&gt;
      `;
      tbody2.appendChild(tr);
    });
    updateSLAndRemark(p2);
    toast(&#x27;উপরের তথ্য নিচে কপি হয়েছে&#x27;, &#x27;success&#x27;);
  }

  function clearFormBlock(block) {
    block.querySelector(&#x27;.inp-transport&#x27;).value = &#x27;&#x27;;
    block.querySelector(&#x27;.inp-gno&#x27;).value = &#x27;&#x27;;
    block.querySelector(&#x27;.inp-supplier&#x27;).value = &#x27;&#x27;;
    block.querySelector(&#x27;.inp-date&#x27;).value = &#x27;&#x27;;
    block.querySelector(&#x27;.inp-address&#x27;).value = &#x27;&#x27;;

    const tbody = block.querySelector(&#x27;.tbody-items&#x27;);
    tbody.innerHTML = `
      &lt;tr&gt;
        &lt;td class=&quot;sl-no&quot;&gt;1&lt;/td&gt;
        &lt;td class=&quot;item-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;inp-item&quot;&gt;&lt;/td&gt;
        &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;pcs-input&quot; oninput=&quot;formatAndCalc(this)&quot;&gt;&lt;/td&gt;
        &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;inp-kg&quot; oninput=&quot;formatAndCalc(this)&quot;&gt;&lt;/td&gt;
        &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;inp-yds&quot; oninput=&quot;formatAndCalc(this)&quot;&gt;&lt;/td&gt;
        &lt;td class=&quot;remark-cell&quot; rowspan=&quot;1&quot; style=&quot;vertical-align: middle;&quot;&gt;
          &lt;textarea class=&quot;inp-remark&quot;&gt;&lt;/textarea&gt;
        &lt;/td&gt;
        &lt;td class=&quot;action-btn-cell&quot;&gt;&lt;button class=&quot;btn-del&quot; onclick=&quot;deleteRow(this)&quot;&gt;×&lt;/button&gt;&lt;/td&gt;
      &lt;/tr&gt;
    `;
    updateSLAndRemark(block);
  }

  function clearAllData() {
    if (confirm(&quot;আপনি কি নিশ্চিত যে গেট পাস নম্বর, তারিখ, রিমার্ক সহ সব তথ্য সম্পূর্ণ ক্লিয়ার করতে চান?&quot;)) {
      clearFormBlock(document.getElementById(&#x27;pass1&#x27;));
      clearFormBlock(document.getElementById(&#x27;pass2&#x27;));
      toast(&#x27;ফর্ম রিসেট হয়েছে&#x27;, &#x27;success&#x27;);
    }
  }

  updateSLAndRemark(document.getElementById(&#x27;pass1&#x27;));
  updateSLAndRemark(document.getElementById(&#x27;pass2&#x27;));
&lt;/script&gt;

&lt;script&gt;
  // ================= AUTOSAVE (draft) =================
  (function(){
    const K = &quot;gate_v2&quot;;
    function sv(){
      if(document.querySelector(&#x27;.print-filler&#x27;)) return;
      try{ localStorage.setItem(K, JSON.stringify(serializeForm())); }catch(e){}
      flashSaved();
    }
    window.__saveDraft = sv;
    function ld(){
      try{
        const d = JSON.parse(localStorage.getItem(K) || &quot;null&quot;);
        if(d) applyForm(d);
      }catch(e){}
    }
    window.addEventListener(&quot;DOMContentLoaded&quot;, ()=&gt;{
      ld();
      calcBlockTotal(document.getElementById(&#x27;pass1&#x27;)); calcBlockTotal(document.getElementById(&#x27;pass2&#x27;));
      document.addEventListener(&quot;input&quot;, sv);
      let st;
      const mo = new MutationObserver(()=&gt;{ clearTimeout(st); st = setTimeout(sv, 250); });
      document.querySelectorAll(&#x27;#tbody-items, .tbody-items&#x27;).forEach(t =&gt; mo.observe(t, {childList:true}));
    });
    const o = window.clearAllData;
    window.clearAllData = function(){ localStorage.removeItem(K); if(o) o(); };
  })();

  // ================= THEME =================
  (function(){ const t = localStorage.getItem(&#x27;ui_theme&#x27;) || &#x27;light&#x27;; document.documentElement.setAttribute(&#x27;data-theme&#x27;, t); })();
  function toggleTheme(){
    const cur = document.documentElement.getAttribute(&#x27;data-theme&#x27;) === &#x27;dark&#x27; ? &#x27;light&#x27; : &#x27;dark&#x27;;
    document.documentElement.setAttribute(&#x27;data-theme&#x27;, cur);
    localStorage.setItem(&#x27;ui_theme&#x27;, cur);
    document.getElementById(&#x27;themeIcon&#x27;).textContent = cur === &#x27;dark&#x27; ? &#x27;☀️&#x27; : &#x27;🌙&#x27;;
  }

  // ================= TOAST =================
  function toast(msg, type){
    type = type || &#x27;info&#x27;;
    let box = document.getElementById(&#x27;toastBox&#x27;);
    if(!box){ box = document.createElement(&#x27;div&#x27;); box.id=&#x27;toastBox&#x27;; box.className=&#x27;toast-container&#x27;; document.body.appendChild(box); }
    const el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;toast &#x27; + type;
    el.textContent = msg;
    box.appendChild(el);
    requestAnimationFrame(()=&gt; el.classList.add(&#x27;show&#x27;));
    setTimeout(()=&gt;{ el.classList.remove(&#x27;show&#x27;); setTimeout(()=&gt; el.remove(), 300); }, 2600);
  }

  function flashSaved(){
    const pill = document.getElementById(&#x27;autosavePill&#x27;);
    if(!pill) return;
    pill.classList.add(&#x27;show&#x27;);
    clearTimeout(window.__savedTimer);
    window.__savedTimer = setTimeout(()=&gt; pill.classList.remove(&#x27;show&#x27;), 1400);
  }

  // ================= COMPANY PROFILE / LETTERHEAD =================
  function loadCompanyProfile(){
    try{
      const p = JSON.parse(localStorage.getItem(&#x27;companyProfile&#x27;)||&#x27;null&#x27;);
      if(!p) return;
      document.querySelectorAll(&#x27;.company-title&#x27;).forEach(e=&gt; { if(p.name) e.textContent = p.name; });
      document.querySelectorAll(&#x27;.company-address&#x27;).forEach(e=&gt; { if(p.address) e.textContent = p.address; });

/* ===== Motion helpers ===== */
(function(){
  if(window.matchMedia &amp;&amp; matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches) return;
  var ready = false;
  var TOTAL_SEL = &#x27;.row-total, .total-row td, tfoot td[id], [id*=&quot;otal&quot;]&#x27;;
  var last = new WeakMap();

  function snapshot(root){
    if(!root.querySelectorAll) return;
    var list = root.matches &amp;&amp; root.matches(TOTAL_SEL) ? [root] : [];
    list = list.concat([].slice.call(root.querySelectorAll(TOTAL_SEL)));
    list.forEach(function(el){ last.set(el, el.textContent); });
  }
  snapshot(document.body);

  function animateRow(tr){
    snapshot(tr);
    tr.classList.add(&#x27;row-in&#x27;);
    setTimeout(function(){ tr.classList.remove(&#x27;row-in&#x27;); }, 600);
  }
  function flash(el){
    el.classList.remove(&#x27;num-flash&#x27;); void el.offsetWidth;
    el.classList.add(&#x27;num-flash&#x27;);
    setTimeout(function(){ el.classList.remove(&#x27;num-flash&#x27;); }, 700);
  }

  new MutationObserver(function(list){
    list.forEach(function(m){
      if(m.type === &#x27;childList&#x27; &amp;&amp; m.target.tagName === &#x27;TBODY&#x27;){
        [].forEach.call(m.addedNodes, function(n){
          if(n.nodeType === 1 &amp;&amp; n.tagName === &#x27;TR&#x27;){ if(ready) animateRow(n); else snapshot(n); }
        });
        return;
      }
      var el = m.target.nodeType === 3 ? m.target.parentNode : m.target;
      if(!el || !el.matches || !el.matches(TOTAL_SEL)) return;
      var prev = last.get(el), now = el.textContent;
      last.set(el, now);
      if(ready &amp;&amp; prev !== undefined &amp;&amp; prev !== now) flash(el);
    });
  }).observe(document.body, {childList:true, subtree:true, characterData:true});

  window.addEventListener(&#x27;load&#x27;, function(){ setTimeout(function(){ ready = true; }, 150); });

  var od = window.deleteRow;
  if(typeof od === &#x27;function&#x27;){
    window.deleteRow = function(btn){
      var tr = btn &amp;&amp; btn.closest &amp;&amp; btn.closest(&#x27;tr&#x27;);
      if(!tr || tr.classList.contains(&#x27;row-out&#x27;) || tr.parentNode.querySelectorAll(&#x27;tr&#x27;).length &lt;= 1){
        return od.apply(this, arguments);
      }
      var self = this, args = arguments;
      tr.classList.add(&#x27;row-out&#x27;);
      setTimeout(function(){ od.apply(self, args); }, 200);
    };
  }

  var ot = window.toggleTheme;
  if(typeof ot === &#x27;function&#x27;){
    window.toggleTheme = function(){
      var h = document.documentElement;
      h.classList.add(&#x27;theme-fade&#x27;);
      setTimeout(function(){ h.classList.remove(&#x27;theme-fade&#x27;); }, 450);
      return ot.apply(this, arguments);
    };
  }
})();

/* ===== Bangladeshi number grouping (12,34,567.50) ===== */
(function(){
  var _pf = window.parseFloat;
  window.parseFloat = function(v){ return _pf(typeof v === &#x27;string&#x27; ? v.replace(/,/g, &#x27;&#x27;) : v); };

  var SEL = &#x27;.pcs-input,.kg-input,.inp-kg,.yds-input,.inp-yds,.rate-input,#advReduction&#x27;;
  function group(d){
    if(d.length &lt;= 3) return d;
    return d.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, &#x27;,&#x27;) + &#x27;,&#x27; + d.slice(-3);
  }
  function fmt(str){
    var raw = String(str).replace(/[^0-9.]/g, &#x27;&#x27;);
    var i = raw.indexOf(&#x27;.&#x27;), hasDot = i &gt;= 0;
    var ip = hasDot ? raw.slice(0, i) : raw;
    var fp = hasDot ? raw.slice(i + 1).replace(/\./g, &#x27;&#x27;) : &#x27;&#x27;;
    ip = ip.replace(/^0+(?=\d)/, &#x27;&#x27;);
    return group(ip) + (hasDot ? &#x27;.&#x27; + fp : &#x27;&#x27;);
  }
  function fmtInput(el){
    var v = el.value;
    var pos = (el.selectionStart == null) ? v.length : el.selectionStart;
    var digitsBefore = v.slice(0, pos).replace(/[^0-9.]/g, &#x27;&#x27;).length;
    var out = fmt(v);
    if(out === v) return;
    el.value = out;
    if(document.activeElement === el &amp;&amp; el.setSelectionRange){
      var cnt = 0, np = 0;
      while(np &lt; out.length &amp;&amp; cnt &lt; digitsBefore){ if(/[0-9.]/.test(out.charAt(np))) cnt++; np++; }
      try{ el.setSelectionRange(np, np); }catch(e){}
    }
  }
  window.formatNumberInput = fmtInput;

  function reformatAll(){
    [].forEach.call(document.querySelectorAll(SEL), function(el){
      if(el.value !== &#x27;&#x27;){ var n = fmt(el.value); if(n !== el.value) el.value = n; }
    });
  }
  window.__reformatAll = reformatAll;

  document.addEventListener(&#x27;input&#x27;, function(e){
    if(e.target &amp;&amp; e.target.matches &amp;&amp; e.target.matches(SEL)) fmtInput(e.target);
  });
  window.addEventListener(&#x27;DOMContentLoaded&#x27;, function(){ setTimeout(reformatAll, 0); });

  function wrap(name, after){
    var o = window[name];
    if(typeof o !== &#x27;function&#x27;) return;
    window[name] = function(){ var r = o.apply(this, arguments); try{ after(); }catch(e){} return r; };
  }
  wrap(&#x27;applyForm&#x27;, reformatAll);

  function qty(sel){
    var t = 0;
    [].forEach.call(document.querySelectorAll(sel), function(i){ t += parseFloat(i.value) || 0; });
    return t.toLocaleString(&#x27;en-IN&#x27;, {maximumFractionDigits: 3});
  }
  function setTotals(){
    var a = document.getElementById(&#x27;totalPcs&#x27;), b = document.getElementById(&#x27;totalKg&#x27;), c = document.getElementById(&#x27;totalYds&#x27;);
    if(a) a.textContent = qty(&#x27;.pcs-input&#x27;);
    if(b) b.textContent = qty(&#x27;.kg-input&#x27;);
    if(c) c.textContent = qty(&#x27;.yds-input&#x27;);
  }
  wrap(&#x27;calcCalculations&#x27;, setTotals);   // Bill
  wrap(&#x27;calcTotals&#x27;, setTotals);         // Requisition
})();

  /* ================= MOTION ================= */
  @keyframes topbarIn{ from{ opacity:0; transform:translateY(-100%); } }

&lt;script&gt;
  // ================= CORE LOGIC (original) =================
  function updateSLAndRemark() {
    const tbody = document.getElementById(&#x27;tbody-items&#x27;);
    const rows = tbody.querySelectorAll(&#x27;tr&#x27;);
    let remarkCell = document.querySelector(&#x27;.remark-cell&#x27;);

    rows.forEach((row, index) =&gt; {
      const slTd = row.querySelector(&#x27;.sl-no&#x27;);
      if (slTd) slTd.textContent = index + 1;
      if (index === 0 &amp;&amp; remarkCell) {
        const actionTd = row.querySelector(&#x27;.action-btn-cell&#x27;);
        row.insertBefore(remarkCell, actionTd);
      }
    });
    if (remarkCell) remarkCell.rowSpan = rows.length &gt; 0 ? rows.length : 1;
    calcTotals();
  }

  function addRow() {
    const tbody = document.getElementById(&#x27;tbody-items&#x27;);
    const tr = document.createElement(&#x27;tr&#x27;);
    tr.innerHTML = `
      &lt;td class=&quot;sl-no&quot;&gt;&lt;/td&gt;
      &lt;td class=&quot;item-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;inp-item&quot;&gt;&lt;/td&gt;
      &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;pcs-input&quot; oninput=&quot;calcTotals()&quot;&gt;&lt;/td&gt;
      &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;kg-input&quot; oninput=&quot;calcTotals()&quot;&gt;&lt;/td&gt;
      &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;yds-input&quot; oninput=&quot;calcTotals()&quot;&gt;&lt;/td&gt;
      &lt;td class=&quot;action-btn-cell&quot;&gt;&lt;button class=&quot;btn-del&quot; onclick=&quot;deleteRow(this)&quot;&gt;×&lt;/button&gt;&lt;/td&gt;
    `;
    tbody.appendChild(tr);
    updateSLAndRemark();
  }

  function deleteRow(btn) {
    const tbody = document.getElementById(&#x27;tbody-items&#x27;);
    if (tbody.querySelectorAll(&#x27;tr&#x27;).length &lt;= 1) {
      toast(&quot;কমপক্ষে একটি রো (Row) থাকতে হবে!&quot;, &#x27;error&#x27;);
      return;
    }
    btn.closest(&#x27;tr&#x27;).remove();
    updateSLAndRemark();
  }

  function calcTotals() {
    let totalPcs = 0, totalKg = 0, totalYds = 0;
    document.querySelectorAll(&#x27;.pcs-input&#x27;).forEach(i =&gt; totalPcs += parseFloat(i.value) || 0);
    document.querySelectorAll(&#x27;.kg-input&#x27;).forEach(i =&gt; totalKg += parseFloat(i.value) || 0);
    document.querySelectorAll(&#x27;.yds-input&#x27;).forEach(i =&gt; totalYds += parseFloat(i.value) || 0);
    document.getElementById(&#x27;totalPcs&#x27;).textContent = totalPcs;
    document.getElementById(&#x27;totalKg&#x27;).textContent = totalKg;
    document.getElementById(&#x27;totalYds&#x27;).textContent = totalYds;
  }

  function clearAllData() {
    if (confirm(&quot;আপনি কি নিশ্চিত যে রেকোয়েস্ট নম্বর, তারিখ, রিমার্ক সহ সব তথ্য সম্পূর্ণ ক্লিয়ার করতে চান?&quot;)) {
      document.querySelector(&#x27;.inp-reqno&#x27;).value = &#x27;&#x27;;
      document.querySelector(&#x27;.inp-date&#x27;).value = &#x27;&#x27;;
      const tbody = document.getElementById(&#x27;tbody-items&#x27;);
      tbody.innerHTML = `
        &lt;tr&gt;
          &lt;td class=&quot;sl-no&quot;&gt;1&lt;/td&gt;
          &lt;td class=&quot;item-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;inp-item&quot;&gt;&lt;/td&gt;
          &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;pcs-input&quot; oninput=&quot;calcTotals()&quot;&gt;&lt;/td&gt;
          &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;kg-input&quot; oninput=&quot;calcTotals()&quot;&gt;&lt;/td&gt;
          &lt;td class=&quot;num-cell&quot;&gt;&lt;input type=&quot;text&quot; class=&quot;yds-input&quot; oninput=&quot;calcTotals()&quot;&gt;&lt;/td&gt;
          &lt;td class=&quot;remark-cell&quot; rowspan=&quot;1&quot; style=&quot;vertical-align: middle;&quot;&gt;
            &lt;textarea class=&quot;inp-remark&quot;&gt;&lt;/textarea&gt;
          &lt;/td&gt;
          &lt;td class=&quot;action-btn-cell&quot;&gt;&lt;button class=&quot;btn-del&quot; onclick=&quot;deleteRow(this)&quot;&gt;×&lt;/button&gt;&lt;/td&gt;
        &lt;/tr&gt;
      `;
      updateSLAndRemark();
      toast(&#x27;ফর্ম রিসেট হয়েছে&#x27;, &#x27;success&#x27;);
    }
  }

  updateSLAndRemark();
&lt;/script&gt;

&lt;script&gt;
  // ================= AUTOSAVE (draft) =================
  (function(){
    const K = &quot;req_v2&quot;;
    function sv(){
      if(document.querySelector(&#x27;.print-filler&#x27;)) return;
      try{ localStorage.setItem(K, JSON.stringify(serializeForm())); }catch(e){}
      flashSaved();
    }
    window.__saveDraft = sv;
    function ld(){
      try{
        const d = JSON.parse(localStorage.getItem(K) || &quot;null&quot;);
        if(d) applyForm(d);
      }catch(e){}
    }
    window.addEventListener(&quot;DOMContentLoaded&quot;, ()=&gt;{
      ld();
      calcTotals();
      document.addEventListener(&quot;input&quot;, sv);
      let st;
      const mo = new MutationObserver(()=&gt;{ clearTimeout(st); st = setTimeout(sv, 250); });
      document.querySelectorAll(&#x27;#tbody-items, .tbody-items&#x27;).forEach(t =&gt; mo.observe(t, {childList:true}));
    });
    const o = window.clearAllData;
    window.clearAllData = function(){ localStorage.removeItem(K); if(o) o(); };
  })();

  // ================= THEME =================
  (function(){ const t = localStorage.getItem(&#x27;ui_theme&#x27;) || &#x27;light&#x27;; document.documentElement.setAttribute(&#x27;data-theme&#x27;, t); })();
  function toggleTheme(){
    const cur = document.documentElement.getAttribute(&#x27;data-theme&#x27;) === &#x27;dark&#x27; ? &#x27;light&#x27; : &#x27;dark&#x27;;
    document.documentElement.setAttribute(&#x27;data-theme&#x27;, cur);
    localStorage.setItem(&#x27;ui_theme&#x27;, cur);
    document.getElementById(&#x27;themeIcon&#x27;).textContent = cur === &#x27;dark&#x27; ? &#x27;☀️&#x27; : &#x27;🌙&#x27;;
  }

  // ================= TOAST =================
  function toast(msg, type){
    type = type || &#x27;info&#x27;;
    let box = document.getElementById(&#x27;toastBox&#x27;);
    if(!box){ box = document.createElement(&#x27;div&#x27;); box.id=&#x27;toastBox&#x27;; box.className=&#x27;toast-container&#x27;; document.body.appendChild(box); }
    const el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;toast &#x27; + type;
    el.textContent = msg;
    box.appendChild(el);
    requestAnimationFrame(()=&gt; el.classList.add(&#x27;show&#x27;));
    setTimeout(()=&gt;{ el.classList.remove(&#x27;show&#x27;); setTimeout(()=&gt; el.remove(), 300); }, 2600);
  }

  function flashSaved(){
    const pill = document.getElementById(&#x27;autosavePill&#x27;);
    if(!pill) return;
    pill.classList.add(&#x27;show&#x27;);
    clearTimeout(window.__savedTimer);
    window.__savedTimer = setTimeout(()=&gt; pill.classList.remove(&#x27;show&#x27;), 1400);
  }

/* ===== Motion helpers ===== */
(function(){
  if(window.matchMedia &amp;&amp; matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches) return;
  var ready = false;
  var TOTAL_SEL = &#x27;.row-total, .total-row td, tfoot td[id], [id*=&quot;otal&quot;]&#x27;;
  var last = new WeakMap();

  function snapshot(root){
    if(!root.querySelectorAll) return;
    var list = root.matches &amp;&amp; root.matches(TOTAL_SEL) ? [root] : [];
    list = list.concat([].slice.call(root.querySelectorAll(TOTAL_SEL)));
    list.forEach(function(el){ last.set(el, el.textContent); });
  }
  snapshot(document.body);

  function animateRow(tr){
    snapshot(tr);
    tr.classList.add(&#x27;row-in&#x27;);
    setTimeout(function(){ tr.classList.remove(&#x27;row-in&#x27;); }, 600);
  }
  function flash(el){
    el.classList.remove(&#x27;num-flash&#x27;); void el.offsetWidth;
    el.classList.add(&#x27;num-flash&#x27;);
    setTimeout(function(){ el.classList.remove(&#x27;num-flash&#x27;); }, 700);
  }

  new MutationObserver(function(list){
    list.forEach(function(m){
      if(m.type === &#x27;childList&#x27; &amp;&amp; m.target.tagName === &#x27;TBODY&#x27;){
        [].forEach.call(m.addedNodes, function(n){
          if(n.nodeType === 1 &amp;&amp; n.tagName === &#x27;TR&#x27;){ if(ready) animateRow(n); else snapshot(n); }
        });
        return;
      }
      var el = m.target.nodeType === 3 ? m.target.parentNode : m.target;
      if(!el || !el.matches || !el.matches(TOTAL_SEL)) return;
      var prev = last.get(el), now = el.textContent;
      last.set(el, now);
      if(ready &amp;&amp; prev !== undefined &amp;&amp; prev !== now) flash(el);
    });
  }).observe(document.body, {childList:true, subtree:true, characterData:true});

  window.addEventListener(&#x27;load&#x27;, function(){ setTimeout(function(){ ready = true; }, 150); });

  var od = window.deleteRow;
  if(typeof od === &#x27;function&#x27;){
    window.deleteRow = function(btn){
      var tr = btn &amp;&amp; btn.closest &amp;&amp; btn.closest(&#x27;tr&#x27;);
      if(!tr || tr.classList.contains(&#x27;row-out&#x27;) || tr.parentNode.querySelectorAll(&#x27;tr&#x27;).length &lt;= 1){
        return od.apply(this, arguments);
      }
      var self = this, args = arguments;
      tr.classList.add(&#x27;row-out&#x27;);
      setTimeout(function(){ od.apply(self, args); }, 200);
    };
  }

  var ot = window.toggleTheme;
  if(typeof ot === &#x27;function&#x27;){
    window.toggleTheme = function(){
      var h = document.documentElement;
      h.classList.add(&#x27;theme-fade&#x27;);
      setTimeout(function(){ h.classList.remove(&#x27;theme-fade&#x27;); }, 450);
      return ot.apply(this, arguments);
    };
  }
})();

/* ===== Bangladeshi number grouping (12,34,567.50) ===== */
(function(){
  var _pf = window.parseFloat;
  window.parseFloat = function(v){ return _pf(typeof v === &#x27;string&#x27; ? v.replace(/,/g, &#x27;&#x27;) : v); };

  var SEL = &#x27;.pcs-input,.kg-input,.inp-kg,.yds-input,.inp-yds,.rate-input,#advReduction&#x27;;
  function group(d){
    if(d.length &lt;= 3) return d;
    return d.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, &#x27;,&#x27;) + &#x27;,&#x27; + d.slice(-3);
  }
  function fmt(str){
    var raw = String(str).replace(/[^0-9.]/g, &#x27;&#x27;);
    var i = raw.indexOf(&#x27;.&#x27;), hasDot = i &gt;= 0;
    var ip = hasDot ? raw.slice(0, i) : raw;
    var fp = hasDot ? raw.slice(i + 1).replace(/\./g, &#x27;&#x27;) : &#x27;&#x27;;
    ip = ip.replace(/^0+(?=\d)/, &#x27;&#x27;);
    return group(ip) + (hasDot ? &#x27;.&#x27; + fp : &#x27;&#x27;);
  }
  function fmtInput(el){
    var v = el.value;
    var pos = (el.selectionStart == null) ? v.length : el.selectionStart;
    var digitsBefore = v.slice(0, pos).replace(/[^0-9.]/g, &#x27;&#x27;).length;
    var out = fmt(v);
    if(out === v) return;
    el.value = out;
    if(document.activeElement === el &amp;&amp; el.setSelectionRange){
      var cnt = 0, np = 0;
      while(np &lt; out.length &amp;&amp; cnt &lt; digitsBefore){ if(/[0-9.]/.test(out.charAt(np))) cnt++; np++; }
      try{ el.setSelectionRange(np, np); }catch(e){}
    }
  }
  window.formatNumberInput = fmtInput;

  function reformatAll(){
    [].forEach.call(document.querySelectorAll(SEL), function(el){
      if(el.value !== &#x27;&#x27;){ var n = fmt(el.value); if(n !== el.value) el.value = n; }
    });
  }
  window.__reformatAll = reformatAll;

  document.addEventListener(&#x27;input&#x27;, function(e){
    if(e.target &amp;&amp; e.target.matches &amp;&amp; e.target.matches(SEL)) fmtInput(e.target);
  });
  window.addEventListener(&#x27;DOMContentLoaded&#x27;, function(){ setTimeout(reformatAll, 0); });

  function wrap(name, after){
    var o = window[name];
    if(typeof o !== &#x27;function&#x27;) return;
    window[name] = function(){ var r = o.apply(this, arguments); try{ after(); }catch(e){} return r; };
  }
  wrap(&#x27;applyForm&#x27;, reformatAll);

  function qty(sel){
    var t = 0;
    [].forEach.call(document.querySelectorAll(sel), function(i){ t += parseFloat(i.value) || 0; });
    return t.toLocaleString(&#x27;en-IN&#x27;, {maximumFractionDigits: 3});
  }
  function setTotals(){
    var a = document.getElementById(&#x27;totalPcs&#x27;), b = document.getElementById(&#x27;totalKg&#x27;), c = document.getElementById(&#x27;totalYds&#x27;);
    if(a) a.textContent = qty(&#x27;.pcs-input&#x27;);
    if(b) b.textContent = qty(&#x27;.kg-input&#x27;);
    if(c) c.textContent = qty(&#x27;.yds-input&#x27;);
  }
  wrap(&#x27;calcCalculations&#x27;, setTotals);   // Bill
  wrap(&#x27;calcTotals&#x27;, setTotals);         // Requisition
})();

(function(){

  window.addEventListener(&#x27;message&#x27;, function(e){
    var d = e.data;

(function(){
  var CFG = {key:&#x27;req_history&#x27;, auto:null, noun:&#x27;রিকুইজিশন&#x27;, cur:function(){ return document.querySelector(&#x27;.inp-reqno&#x27;).value; }, no:function(r){ return r.reqno; }, who:null};
  var st = document.createElement(&#x27;style&#x27;);
  st.textContent = &#x27;.toast.warn{ border-left-color:#f59e0b; }&#x27;;
  document.head.appendChild(st);
  function history(){ try{ return JSON.parse(localStorage.getItem(CFG.key) || &#x27;[]&#x27;); }catch(e){ return []; } }
  function find(no){
    no = String(no || &#x27;&#x27;).trim(); if(!no) return null;
    var a = history();
    for(var i = 0; i &lt; a.length; i++){ if(String(CFG.no(a[i]) || &#x27;&#x27;).trim() === no) return a[i]; }
    return null;
  }
  function warn(msg){
    if(window.__S &amp;&amp; window.__S.dupWarn === false) return;
    var box = document.getElementById(&#x27;toastBox&#x27;);
    if(!box){ box = document.createElement(&#x27;div&#x27;); box.id = &#x27;toastBox&#x27;; box.className = &#x27;toast-container&#x27;; document.body.appendChild(box); }
    var el = document.createElement(&#x27;div&#x27;); el.className = &#x27;toast warn&#x27;; el.textContent = &#x27;⚠️ &#x27; + msg;
    box.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add(&#x27;show&#x27;); });
    setTimeout(function(){ el.classList.remove(&#x27;show&#x27;); setTimeout(function(){ el.remove(); }, 300); }, 6000);
  }
  function text(no, r, saved){
    var w = CFG.who ? CFG.who(r) : &#x27;&#x27;;
    return (saved === true ? &#x27;সেভ হয়েছে, কিন্তু &#x27; : (saved || &#x27;&#x27;)) + CFG.noun + &#x27; নম্বর &#x27; + no + &#x27; আগে প্রিন্ট বা সেভ করা আছে&#x27; + (w ? &#x27; (সাপ্লায়ার: &#x27; + w + &#x27;)&#x27; : &#x27;&#x27;) + &#x27; — একই নম্বর দুইবার হতে পারে।&#x27;;
  }
  window.__dupCheck = function(no, prefix){ var rec = find(no); if(rec) warn(text(no, rec, prefix || &#x27;&#x27;)); return rec; };
  var oa = CFG.auto ? window[CFG.auto] : null;
  if(typeof oa === &#x27;function&#x27;) window[CFG.auto] = function(){
    var r = oa.apply(this, arguments);
    var no = CFG.cur(), rec = find(no);
    if(rec) warn(text(no, rec, false));
    return r;
  };
  var os = window.saveToHistory;
  if(typeof os === &#x27;function&#x27;) window.saveToHistory = function(){
    var no = CFG.cur(), rec = find(no), n0 = history().length;
    var r = os.apply(this, arguments);
    if(rec &amp;&amp; history().length &gt; n0) warn(text(no, rec, true));
    return r;
  };
})();


/* Number box always shows the last number used; everything else stays empty */
(function(){
  var SEL = &#x27;.inp-reqno&#x27;, KEY = &#x27;lastno_req&#x27;, CTR = &#x27;req_counter&#x27;;
  function last(){ try{ return localStorage.getItem(KEY) || localStorage.getItem(CTR) || &#x27;&#x27;; }catch(e){ return &#x27;&#x27;; } }
  function fill(){
    var l = last(); if(!l) return;
    [].forEach.call(document.querySelectorAll(SEL), function(e){ if(e.value.trim() === &#x27;&#x27;) e.value = l; });
  }
  document.addEventListener(&#x27;input&#x27;, function(e){
    if(e.target &amp;&amp; e.target.matches &amp;&amp; e.target.matches(SEL)){
      var v = e.target.value.trim();
      if(v){ try{ localStorage.setItem(KEY, v); }catch(_){} }
    }
  });
  window.addEventListener(&#x27;DOMContentLoaded&#x27;, function(){ setTimeout(function(){ fill(); }, 0); });
  var oc = window.clearAllData;
  if(typeof oc === &#x27;function&#x27;) window.clearAllData = function(){
    var r = oc.apply(this, arguments);
    setTimeout(function(){ fill(); if(window.__saveDraft) window.__saveDraft(); }, 0);
    return r;
  };
  // do not save a completely empty record (the number alone is not data)
  function hasContent(){
    var any = false;
    [].forEach.call(document.querySelectorAll(&#x27;.inp-supplier,.inp-item,.pcs-input,.kg-input,.inp-kg,.yds-input,.inp-yds,.rate-input&#x27;), function(e){
      if(e.value.trim() !== &#x27;&#x27;) any = true;
    });
    return any;
  }
  var os = window.saveToHistory;
  if(typeof os === &#x27;function&#x27;) window.saveToHistory = function(){
    if(!hasContent()){ if(typeof toast === &#x27;function&#x27;) toast(&#x27;আগে কিছু তথ্য পূরণ করুন&#x27;, &#x27;error&#x27;); return; }
    return os.apply(this, arguments);
  };
})();


/* ===== Enter = go to the next field ===== */
document.addEventListener(&#x27;keydown&#x27;, function(e){
  if(e.key !== &#x27;Enter&#x27; || e.shiftKey || e.ctrlKey || e.altKey || e.metaKey || e.isComposing) return;
  if(window.__S &amp;&amp; window.__S.enterNext === false) return;
  var t = e.target;
  if(!t || (t.tagName !== &#x27;INPUT&#x27; &amp;&amp; t.tagName !== &#x27;TEXTAREA&#x27;)) return;
  if(t.closest(&#x27;.modal-overlay&#x27;)) return;
  var root = t.closest(&#x27;.a4-page&#x27;); if(!root) return;
  var list = [].filter.call(root.querySelectorAll(&#x27;input, textarea&#x27;), function(el){
    var ty = (el.type || &#x27;&#x27;).toLowerCase();
    return ty !== &#x27;hidden&#x27; &amp;&amp; ty !== &#x27;file&#x27; &amp;&amp; ty !== &#x27;checkbox&#x27; &amp;&amp; ty !== &#x27;radio&#x27; &amp;&amp; ty !== &#x27;button&#x27; &amp;&amp;
           !el.disabled &amp;&amp; !el.readOnly &amp;&amp; el.offsetParent !== null;
  });
  var rem = list.filter(function(el){ return el.classList &amp;&amp; el.classList.contains(&#x27;inp-remark&#x27;); });
  if(rem.length){ list = list.filter(function(el){ return rem.indexOf(el) &lt; 0; }).concat(rem); }   // remark box is shown last
  var i = list.indexOf(t); if(i &lt; 0) return;
  e.preventDefault();
  // Enter on the last field of the last (filled) row = add a new row
  var tr = t.tagName === &#x27;INPUT&#x27; ? t.closest(&#x27;tbody tr&#x27;) : null;
  if(tr &amp;&amp; !tr.parentNode.classList.contains(&#x27;add-tbody&#x27;) &amp;&amp; !tr.nextElementSibling &amp;&amp; window.__addRowFocus &amp;&amp; !(window.__S &amp;&amp; window.__S.enterAddRow === false)){
    var ins = tr.querySelectorAll(&#x27;input&#x27;);
    if(ins[ins.length - 1] === t &amp;&amp; [].some.call(ins, function(x){ return x.value.trim() !== &#x27;&#x27;; })){ window.__addRowFocus(); return; }
  }
  var n = list[i + 1];
  if(n){ n.focus(); if(n.select) n.select(); }
});

  // Print History is controlled ONLY by the Save button now (Print/PDF just prints; it no longer

  function recordSave(opts){

    var silent = !!opts.silent;

  Object.assign(CFG, {num: num, fmt: fmt, fmt2: fmt2, qtyText: qtyText, nonEmpty: nonEmpty, totalsRow: totalsRow});

  function slipHTML(h){

    var name = (co ? co.textContent : &#x27;&#x27;).replace(/^MASTERTEX\b/i, &#x27;MASTER TEX&#x27;), addr = ad ? ad.textContent : &#x27;&#x27;;

  // ---------- batch print: many receipts on A4 pages ----------

  function plan(){

(function(){
  var SEL = '.pcs-input,.kg-input,.inp-kg,.yds-input,.inp-yds,.rate-input';
  var box = null, target = null, expr = '';
  function ensure(){
    if(box) return box;
    box = document.createElement('div');
    box.id = 'osCalc';
    box.innerHTML = '&lt;div class=&quot;oc-bar&quot;&gt;&lt;span class=&quot;oc-title&quot;&gt;ক্যালকুলেটর&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;oc-hide&quot; data-k=&quot;HIDE&quot; title=&quot;বন্ধ&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;oc-disp&quot; id=&quot;ocDisp&quot;&gt;0&lt;/div&gt;' +
      '&lt;div class=&quot;oc-keys&quot;&gt;' +
      ['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C','⌫','OK'].map(function(k){
        var cls = (k==='OK'?' ok':(k==='C'||k==='⌫'?' op':(/[\\/*\\-+=]/.test(k)?' op':'')));
        return '&lt;button type=&quot;button&quot; data-k=&quot;'+k+'&quot; class=&quot;oc-k'+cls+'&quot;&gt;'+k+'&lt;/button&gt;';
      }).join('') +
      '&lt;/div&gt;';
    var st = document.createElement('style');
    st.textContent = '#osCalc{position:fixed;z-index:10000;width:220px;background:var(--card,#fff);color:var(--text,#111);border:1.5px solid var(--accent1,#0f766e);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.28);padding:10px;display:none;font-family:Arial,sans-serif;}' +
      '#osCalc .oc-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}' +
      '#osCalc .oc-title{font-size:11px;font-weight:800;color:var(--muted,#6b7686);}' +
      '#osCalc .oc-hide{border:0;background:rgba(127,127,127,.15);width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:13px;color:inherit;line-height:1;}' +
      '#osCalc .oc-disp{background:rgba(15,118,110,.08);border-radius:8px;padding:8px 10px;font-size:18px;font-weight:800;text-align:right;margin-bottom:8px;min-height:28px;word-break:break-all;}' +
      '#osCalc .oc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}' +
      '#osCalc .oc-k{height:40px;border:1px solid var(--border,#e3e8f2);border-radius:10px;background:transparent;color:inherit;font-weight:800;font-size:15px;cursor:pointer;}' +
      '#osCalc .oc-k.op{background:rgba(15,118,110,.10);color:var(--accent1,#0f766e);}' +
      '#osCalc .oc-k.ok{grid-column:span 2;background:var(--grad,linear-gradient(135deg,#0f766e,#0891b2));color:#fff;border:0;}' +
      '#osCalc .oc-k:active{transform:scale(.96);}' +
      '@media print{#osCalc{display:none!important;}}';
    document.head.appendChild(st);
    document.body.appendChild(box);
    box.addEventListener('click', function(e){
      var b = e.target.closest('[data-k]'); if(!b) return;
      var k = b.getAttribute('data-k');

      if(k === 'C'){ expr = ''; }
      else if(k === '⌫'){ expr = expr.slice(0, -1); }

  function place(){
    if(!target) return;

    var leftSpace = r.left;

})();

(function(){

(function(){

      '&lt;div class=&quot;oc-keys&quot;&gt;' +
      ['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C','⌫','OK'].map(function(k){
        var cls = (k==='OK'?' ok':(k==='C'||k==='⌫'?' op':(/[\\/*\\-+=]/.test(k)?' op':'')));
        return '&lt;button type=&quot;button&quot; data-k=&quot;'+k+'&quot; class=&quot;oc-k'+cls+'&quot;&gt;'+k+'&lt;/button&gt;';
      }).join('') +

    var st = document.createElement('style');
    st.textContent = '#osCalc{position:fixed;z-index:10000;width:220px;background:var(--card,#fff);color:var(--text,#111);border:1.5px solid var(--accent1,#0f766e);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.28);padding:10px;display:none;font-family:Arial,sans-serif;}' +
      '#osCalc .oc-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}' +
      '#osCalc .oc-title{font-size:11px;font-weight:800;color:var(--muted,#6b7686);}' +
      '#osCalc .oc-hide{border:0;background:rgba(127,127,127,.15);width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:13px;color:inherit;line-height:1;}' +
      '#osCalc .oc-disp{background:rgba(15,118,110,.08);border-radius:8px;padding:8px 10px;font-size:18px;font-weight:800;text-align:right;margin-bottom:8px;min-height:28px;word-break:break-all;}' +

/* ===== Bangladeshi number grouping (12,34,567.50) ===== */
(function(){
  var _pf = window.parseFloat;
  window.parseFloat = function(v){ return _pf(typeof v === &#x27;string&#x27; ? v.replace(/,/g, &#x27;&#x27;) : v); };

  var SEL = &#x27;.pcs-input,.kg-input,.inp-kg,.yds-input,.inp-yds,.rate-input,#advReduction&#x27;;
  function group(d){
    if(d.length &lt;= 3) return d;
    return d.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, &#x27;,&#x27;) + &#x27;,&#x27; + d.slice(-3);
  }
  function fmt(str){
    var raw = String(str).replace(/[^0-9.]/g, &#x27;&#x27;);
    var i = raw.indexOf(&#x27;.&#x27;), hasDot = i &gt;= 0;
    var ip = hasDot ? raw.slice(0, i) : raw;
    var fp = hasDot ? raw.slice(i + 1).replace(/\./g, &#x27;&#x27;) : &#x27;&#x27;;
    ip = ip.replace(/^0+(?=\d)/, &#x27;&#x27;);
    return group(ip) + (hasDot ? &#x27;.&#x27; + fp : &#x27;&#x27;);
  }
  function fmtInput(el){
    var v = el.value;
    var pos = (el.selectionStart == null) ? v.length : el.selectionStart;
    var digitsBefore = v.slice(0, pos).replace(/[^0-9.]/g, &#x27;&#x27;).length;
    var out = fmt(v);
    if(out === v) return;
    el.value = out;
    if(document.activeElement === el &amp;&amp; el.setSelectionRange){
      var cnt = 0, np = 0;
      while(np &lt; out.length &amp;&amp; cnt &lt; digitsBefore){ if(/[0-9.]/.test(out.charAt(np))) cnt++; np++; }
      try{ el.setSelectionRange(np, np); }catch(e){}
    }
  }
  window.formatNumberInput = fmtInput;

  function reformatAll(){
    [].forEach.call(document.querySelectorAll(SEL), function(el){
      if(el.value !== &#x27;&#x27;){ var n = fmt(el.value); if(n !== el.value) el.value = n; }
    });
  }
  window.__reformatAll = reformatAll;

  document.addEventListener(&#x27;input&#x27;, function(e){
    if(e.target &amp;&amp; e.target.matches &amp;&amp; e.target.matches(SEL)) fmtInput(e.target);
  });
  window.addEventListener(&#x27;DOMContentLoaded&#x27;, function(){ setTimeout(reformatAll, 0); });

  function wrap(name, after){
    var o = window[name];
    if(typeof o !== &#x27;function&#x27;) return;
    window[name] = function(){ var r = o.apply(this, arguments); try{ after(); }catch(e){} return r; };
  }
  wrap(&#x27;applyForm&#x27;, reformatAll);

  function qty(sel){
    var t = 0;
    [].forEach.call(document.querySelectorAll(sel), function(i){ t += parseFloat(i.value) || 0; });
    return t.toLocaleString(&#x27;en-IN&#x27;, {maximumFractionDigits: 3});
  }
  function setTotals(){
    var a = document.getElementById(&#x27;totalPcs&#x27;), b = document.getElementById(&#x27;totalKg&#x27;), c = document.getElementById(&#x27;totalYds&#x27;);
    if(a) a.textContent = qty(&#x27;.pcs-input&#x27;);
    if(b) b.textContent = qty(&#x27;.kg-input&#x27;);
    if(c) c.textContent = qty(&#x27;.yds-input&#x27;);
  }
  wrap(&#x27;calcCalculations&#x27;, setTotals);   // Bill
  wrap(&#x27;calcTotals&#x27;, setTotals);         // Requisition
})();

        }).join(&#x27;&#x27;);

    var ot = window.toggleTheme;
    if(typeof ot === &#x27;function&#x27;) window.toggleTheme = function(){
      var r = ot.apply(this, arguments);
      window.parent.postMessage({type: &#x27;theme-changed&#x27;, theme: document.documentElement.getAttribute(&#x27;data-theme&#x27;)}, &#x27;*&#x27;);
      return r;
    };
    window.addEventListener(&#x27;DOMContentLoaded&#x27;, function(){
      setTimeout(function(){ window.parent.postMessage({type: &#x27;need-settings&#x27;}, &#x27;*&#x27;); }, 60);
      [].forEach.call(document.querySelectorAll(&#x27;.icon-btn[onclick=&quot;openSettings()&quot;]&#x27;), function(b){ b.title = &#x27;Settings&#x27;; });
    });
    var last = 0;
    [&#x27;keydown&#x27;, &#x27;click&#x27;, &#x27;input&#x27;, &#x27;touchstart&#x27;, &#x27;scroll&#x27;].forEach(function(ev){
      document.addEventListener(ev, function(){

/* ===== On-screen calculator for PCS / KG / YDS ===== */
(function(){
  var SEL = '.pcs-input,.kg-input,.inp-kg,.yds-input,.inp-yds,.rate-input';
  var box = null, target = null, expr = '';
  function ensure(){
    if(box) return box;
    box = document.createElement('div');
    box.id = 'osCalc';
    box.innerHTML = '&lt;div class=&quot;oc-bar&quot;&gt;&lt;span class=&quot;oc-title&quot;&gt;ক্যালকুলেটর&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;oc-hide&quot; data-k=&quot;HIDE&quot; title=&quot;বন্ধ&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;oc-disp&quot; id=&quot;ocDisp&quot;&gt;0&lt;/div&gt;' +
      '&lt;div class=&quot;oc-keys&quot;&gt;' +
      ['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C','⌫','OK'].map(function(k){
        var cls = (k==='OK'?' ok':(k==='C'||k==='⌫'?' op':(/[\\/*\\-+=]/.test(k)?' op':'')));
        return '&lt;button type=&quot;button&quot; data-k=&quot;'+k+'&quot; class=&quot;oc-k'+cls+'&quot;&gt;'+k+'&lt;/button&gt;';
      }).join('') +
      '&lt;/div&gt;';
    var st = document.createElement('style');
    st.textContent = '#osCalc{position:fixed;z-index:10000;width:220px;background:var(--card,#fff);color:var(--text,#111);border:1.5px solid var(--accent1,#0f766e);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.28);padding:10px;display:none;font-family:Arial,sans-serif;}' +
      '#osCalc .oc-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}' +
      '#osCalc .oc-title{font-size:11px;font-weight:800;color:var(--muted,#6b7686);}' +
      '#osCalc .oc-hide{border:0;background:rgba(127,127,127,.15);width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:13px;color:inherit;line-height:1;}' +
      '#osCalc .oc-disp{background:rgba(15,118,110,.08);border-radius:8px;padding:8px 10px;font-size:18px;font-weight:800;text-align:right;margin-bottom:8px;min-height:28px;word-break:break-all;}' +
      '#osCalc .oc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}' +
      '#osCalc .oc-k{height:40px;border:1px solid var(--border,#e3e8f2);border-radius:10px;background:transparent;color:inherit;font-weight:800;font-size:15px;cursor:pointer;}' +
      '#osCalc .oc-k.op{background:rgba(15,118,110,.10);color:var(--accent1,#0f766e);}' +
      '#osCalc .oc-k.ok{grid-column:span 2;background:var(--grad,linear-gradient(135deg,#0f766e,#0891b2));color:#fff;border:0;}' +
      '#osCalc .oc-k:active{transform:scale(.96);}' +
      '@media print{#osCalc{display:none!important;}}';
    document.head.appendChild(st);
    document.body.appendChild(box);
    box.addEventListener('click', function(e){
      var b = e.target.closest('[data-k]'); if(!b) return;
      var k = b.getAttribute('data-k');
      if(k === 'HIDE'){ try{ localStorage.setItem('os_calc_enabled','0'); }catch(e){} hide(); return; }
      if(k === 'C'){ expr = ''; }
      else if(k === '⌫'){ expr = expr.slice(0, -1); }
      else if(k === '='){ try{ var v = Function('&quot;use strict&quot;;return ('+expr.replace(/[^0-9.+\\-*/() ]/g,'')+')')(); if(typeof v==='number' &amp;&amp; isFinite(v)) expr = String(Math.round(v*1000)/1000); }catch(err){} }
      else if(k === 'OK'){
        if(target){
          try{ var v2 = Function('&quot;use strict&quot;;return ('+expr.replace(/[^0-9.+\\-*/() ]/g,'')+')')(); if(typeof v2==='number' &amp;&amp; isFinite(v2)) expr = String(Math.round(v2*1000)/1000); }catch(err){}
          target.value = expr || '0';
          target.dispatchEvent(new Event('input', {bubbles:true}));
          if(typeof formatNumberInput === 'function') formatNumberInput(target);
          if(typeof calcCalculations === 'function') calcCalculations();
          if(typeof calcTotals === 'function') calcTotals();
          if(typeof formatAndCalc === 'function') formatAndCalc(target);
        }
        hide(); return;
      }
      else { expr += k; }
      document.getElementById('ocDisp').textContent = expr || '0';
    });
    document.addEventListener('mousedown', function(e){
      if(box.style.display === 'block' &amp;&amp; !box.contains(e.target) &amp;&amp; e.target !== target) hide();
    }, true);
    return box;
  }
  function place(){
    if(!target) return;
    var r = target.getBoundingClientRect();
    var w = 220, h = 268;
    var gap = 8;
    var rightSpace = window.innerWidth - r.right;
    var leftSpace = r.left;
    var left, top;
    if(rightSpace &gt;= w + gap){
      left = r.right + gap;
      top = Math.min(Math.max(6, r.top), window.innerHeight - h - 6);
    } else if(leftSpace &gt;= w + gap){
      left = r.left - w - gap;
      top = Math.min(Math.max(6, r.top), window.innerHeight - h - 6);
    } else {
      left = Math.min(Math.max(6, r.left), window.innerWidth - w - 8);
      top = r.bottom + gap;
      if(top + h &gt; window.innerHeight - 6) top = Math.max(6, r.top - h - gap);
    }
    box.style.left = left + 'px'; box.style.top = top + 'px';
  }
  function show(el){
    try{ if(localStorage.getItem('os_calc_enabled') === '0') return; }catch(e){}
    target = el; ensure();
    expr = String(el.value || '').replace(/,/g, '');
    document.getElementById('ocDisp').textContent = expr || '0';
    box.style.display = 'block'; place();
  }
  function hide(){ if(box) box.style.display = 'none'; target = null; expr = ''; }
  document.addEventListener('focusin', function(e){
    if(e.target &amp;&amp; e.target.matches &amp;&amp; e.target.matches(SEL)) show(e.target);
  });
  document.addEventListener('focusout', function(e){
    // delay so button clicks register
    setTimeout(function(){ if(box &amp;&amp; box.style.display==='block' &amp;&amp; document.activeElement !== target &amp;&amp; !box.contains(document.activeElement)) hide(); }, 180);
  });
  window.addEventListener('scroll', function(){ if(box &amp;&amp; box.style.display==='block') place(); }, true);
  window.addEventListener('resize', function(){ if(box &amp;&amp; box.style.display==='block') place(); });
})();

      '<div class="sf" style="flex:1;min-width:150px"><label>বন্ধ থাকার সময়</label><select onchange="__aset(\'lockSec\',+this.value)">' + [[30, '৩০ সেকেন্ড'], [60, '১ মিনিট'], [300, '৫ মিনিট'], [900, '১৫ মিনিট']].map(o => '<option value="' + o[0] + '"' + (a.lockSec === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div></div>' +
      '<div class="sg">🔑 রিকভারি কোড ও লগইন বন্ধ</div><div class="row"><input type="password" id="admPw" placeholder="আপনার (অ্যাডমিন) পাসওয়ার্ড" style="flex:1;min-width:160px"><button class="sb s" onclick="__newRec()">নতুন রিকভারি কোড</button><button class="sb s r" onclick="__disableLogin()">লগইন বন্ধ করুন</button></div>' +
      '<div class="sg">📜 লগইন লগ</div><div class="logbox">' + ((LS.get(LOG_KEY, []) || []).slice(0, 50).map(l => esc(l.t) + ' — <b>' + esc(l.u) + '</b>: ' + esc(l.ev)).join('<br>') || 'কিছু নেই') + '</div>' +
      '<div style="margin-top:6px"><button class="sb s g" onclick="__clearLog()">লগ মুছুন</button></div>';
    return h;
  }
  const chk = pw => (pw || '').length >= 4;
  window.__enableLogin = function(){
    const u = $('#lgU').value.trim(), p1 = $('#lgP1').value, p2 = $('#lgP2').value;
    if(!u){ tip('ইউজারনেম দিন'); return; } if(!chk(p1)){ tip('পাসওয়ার্ড অন্তত ৪ অক্ষরের দিন'); return; } if(p1 !== p2){ tip('দুই পাসওয়ার্ড মিলছে না'); return; }
    const salt = rnd(16), rc = rnd(12), rs = rnd(16);
    const a = {enabled: true, users: [{u, role: 'admin', salt, hash: hashPw(p1, salt)}], idleMin: 0, maxFail: 5, lockSec: 60, recovery: {salt: rs, hash: hashPw(rc, rs)}};
    saveA(a); sessionStorage.setItem(SESS, JSON.stringify({u, t: Date.now()})); cur = {u, role: 'admin'}; lastAct = Date.now();
    recShow = rc.replace(/(.{4})(?=.)/g, '$1-'); logEv(u, 'লগইন চালু হয়েছে'); applyAll(); renderTab(); tip('লগইন চালু হয়েছে ✓');
  };
  window.__recDone = () => { recShow = ''; renderTab(); };
  window.__myPw = function(){
    const a = A(), me = a.users.find(x => x.u === cur.u), o = $('#pwO').value, n = $('#pwN').value, n2 = $('#pwN2').value;
    if(!me || hashPw(o, me.salt) !== me.hash){ tip('বর্তমান পাসওয়ার্ড ভুল'); return; } if(!chk(n)){ tip('নতুন পাসওয়ার্ড অন্তত ৪ অক্ষরের দিন'); return; } if(n !== n2){ tip('নতুন পাসওয়ার্ড দুইবার মিলছে না'); return; }
    me.salt = rnd(16); me.hash = hashPw(n, me.salt); saveA(a); logEv(cur.u, 'পাসওয়ার্ড বদল'); renderTab(); tip('পাসওয়ার্ড বদলেছে ✓');
  };
  window.__addUser = function(){
    const a = A(), u = $('#nuU').value.trim(), p = $('#nuP').value, r = $('#nuR').value;
    if(!u){ tip('ইউজারনেম দিন'); return; } if(!chk(p)){ tip('পাসওয়ার্ড অন্তত ৪ অক্ষরের দিন'); return; }
    if(a.users.some(x => x.u.toLowerCase() === u.toLowerCase())){ tip('এই ইউজারনেম আগেই আছে'); return; }
    const salt = rnd(16); a.users.push({u, role: r, salt, hash: hashPw(p, salt)}); saveA(a); logEv(cur.u, 'ইউজার যোগ: ' + u + ' (' + r + ')'); renderTab(); tip('ইউজার যোগ হয়েছে ✓');
  };
  window.__resetPw = function(i){
    const a = A(), p = $('#rp' + i).value; if(!chk(p)){ tip('নতুন পাসওয়ার্ড অন্তত ৪ অক্ষরের দিন'); return; }
    const u = a.users[i]; u.salt = rnd(16); u.hash = hashPw(p, u.salt); saveA(a); logEv(cur.u, 'পাসওয়ার্ড রিসেট: ' + u.u); renderTab(); tip(u.u + '-এর পাসওয়ার্ড রিসেট হয়েছে ✓');
  };
  window.__role = function(el){
    const a = A(), u = a.users[+el.dataset.i], nr = el.value;
    if(u.role === 'admin' && nr !== 'admin' && nAdmins(a) < 2){ tip('অন্তত একজন অ্যাডমিন থাকতেই হবে'); renderTab(); return; }
    u.role = nr; saveA(a); logEv(cur.u, 'ভূমিকা বদল: ' + u.u + ' → ' + nr);
    if(u.u === cur.u){ cur.role = nr; applyAll(); renderTabs(); } renderTab(); tip('ভূমিকা বদলেছে ✓');
  };
  window.__delUser = function(i){
    const a = A(), u = a.users[i];
    if(u.u === cur.u){ tip('নিজেকে মুছতে পারবেন না'); return; }
    if(u.role === 'admin' && nAdmins(a) < 2){ tip('অন্তত একজন অ্যাডমিন থাকতেই হবে'); return; }
    if(!confirm(u.u + ' ইউজারকে মুছবেন?')) return;
    a.users.splice(i, 1); saveA(a); logEv(cur.u, 'ইউজার মোছা: ' + u.u); renderTab();
  };
  window.__aset = (k, v) => { const a = A(); a[k] = v; saveA(a); tip('সেভ হয়েছে ✓'); };
  function adminOk(){ const a = A(), me = a.users.find(x => x.u === cur.u), pw = $('#admPw').value; if(!me || hashPw(pw, me.salt) !== me.hash){ tip('অ্যাডমিন পাসওয়ার্ড ভুল'); return null; } return a; }
  window.__newRec = function(){ const a = adminOk(); if(!a) return; const rc = rnd(12), rs = rnd(16); a.recovery = {salt: rs, hash: hashPw(rc, rs)}; saveA(a); recShow = rc.replace(/(.{4})(?=.)/g, '$1-'); logEv(cur.u, 'নতুন রিকভারি কোড'); renderTab(); };
  window.__disableLogin = function(){ const a = adminOk(); if(!a) return; if(!confirm('লগইন বন্ধ করলে পেজ পাসওয়ার্ড ছাড়াই খুলবে। (ইউজার তালিকা থেকে যাবে।) চালিয়ে যাবেন?')) return; a.enabled = false; saveA(a); logEv(cur.u, 'লগইন বন্ধ হয়েছে'); sessionStorage.removeItem(SESS); cur = {u: '', role: 'admin'}; recShow = ''; applyAll(); renderTabs(); renderTab(); tip('লগইন বন্ধ হয়েছে'); };
  window.__clearLog = () => { LS.del(LOG_KEY); renderTab(); };

  /* ---------- messages from the three pages ---------- */
  window.addEventListener('message', e => {
    const d = e.data; if(!d || !d.type) return;
    if(d.type === 'open-settings') window.openSettings();
    else if(d.type === 'edit-record'){
      const map = {bill:1, gate:2, req:3};
      const idx = map[d.kind];
      if(idx != null){
        try{
          const btns = $$('nav button:not(#navClose)');
          if(btns[idx]) sw(idx, btns[idx]);
          setTimeout(function(){
            let fr = null;
            try{ fr = (typeof roleFrame !== 'undefined' && roleFrame[d.kind]) ? roleFrame[d.kind] : null; }catch(e){}
            if(!fr){ fr = $$('iframe').find(function(f){ return f.dataset && f.dataset.role === d.kind; }); }
            if(fr && fr.contentWindow) fr.contentWindow.postMessage({type:'load-history-id', id:d.id}, '*');
          }, 250);
        }catch(err){}
      }
    }
    else if(d.type === 'need-settings') send(e.source);
    else if(d.type === 'theme-changed'){ if(S.theme !== d.theme){ S.theme = d.theme; save(); applyAll(); if($('#setModal').classList.contains('show') && tab === 'ui') renderTab(); } }
    else if(d.type === 'activity') lastAct = Date.now();
    else if(d.type === 'goto-tab'){ const i = {home: 0, bill: 1, gate: 2, req: 3, products: 4, report: 5, history: 6}[d.tab], btn = $$('nav button:not(#navClose)')[i]; if(btn && typeof sw === 'function') sw(i, btn); }
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(S.theme === 'auto') applyAll(); });

  window.toggleDrawer = () => document.body.classList.toggle('nav-open');
  window.openDrawer = () => document.body.classList.add('nav-open');
  window.closeDrawer = () => document.body.classList.remove('nav-open');
  if(!$('.nav-backdrop')){
    const bd = document.createElement('div'); bd.className = 'nav-backdrop'; bd.onclick = closeDrawer;
    document.body.appendChild(bd);
  }
  const _sw = window.sw;
  if(typeof _sw === 'function') window.sw = function(){ const r = _sw.apply(this, arguments); closeDrawer(); try{ closeSettings(); }catch(e){} return r; };

  checkSession(); applyAll();
  window.__app = {get S(){ return S; }, get cur(){ return cur; }};
  /* Auto backup reminder every 7 days */
  setTimeout(function(){
    try{
      var last = parseInt(localStorage.getItem('last_backup_at') || '0', 10);
      var days = (Date.now() - last) / 86400000;
      if(!last || days >= 7){
        tip('💾 ব্যাকআপ নেওয়ার সময় হয়েছে — Settings → ডেটা থেকে ব্যাকআপ ডাউনলোড করুন');
      }
    }catch(e){}
  }, 2500);
})();
</script>
</body>
</html>
